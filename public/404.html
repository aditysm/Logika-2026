<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logika 2026</title>
    <script>
      // Single Page App redirect script for GitHub Pages
      // Keeps deep links, subpaths, and query strings intact
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;

        // If visiting /mhs/:id
        var mhsMatch = path.match(/\/mhs\/([^/?#]+)/i);
        if (mhsMatch && mhsMatch[1]) {
          window.location.replace('/#mhs=' + encodeURIComponent(mhsMatch[1]));
          return;
        }

        // Generic fallback to root with preserved path
        var cleanPath = path.replace(/^\//, '').replace(/\/$/, '');
        if (cleanPath) {
          window.location.replace('/#' + cleanPath + (search || '') + (hash || ''));
        } else {
          window.location.replace('/' + (search || '') + (hash || ''));
        }
      })();
    </script>
  </head>
  <body style="font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f8fafc; color: #334155;">
    <div style="text-align: center;">
      <p style="font-size: 1rem; font-weight: 500;">Memuat profil mahasiswa Logika 2026...</p>
    </div>
  </body>
</html>
